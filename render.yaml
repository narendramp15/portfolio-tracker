services:
  # FastAPI Backend
  - type: web
    name: portfolio-tracker-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn portfolio_tracker.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-tracker-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ZERODHA_API_KEY
        sync: false
      - key: ZERODHA_API_SECRET
        sync: false
      - key: ZERODHA_REDIRECT_URL
        sync: false
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_API_SECRET
        sync: false
      - key: ANGEL_REDIRECT_URL
        sync: false
      - key: FIVEPAISA_API_KEY
        sync: false
      - key: FIVEPAISA_API_SECRET
        sync: false
      - key: FIVEPAISA_REDIRECT_URL
        sync: false

databases:
  - name: portfolio-tracker-db
    databaseName: portfolio_tracker
    user: portfolio_user
    plan: free
