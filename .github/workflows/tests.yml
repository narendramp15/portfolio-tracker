name: Tests

on:
  push:
    # Every branch. Previously this only ran on main and develop, so no feature
    # branch was ever tested before it was merged.
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # pyproject declares requires-python = ">=3.13"; the old 3.9-3.12 matrix
      # could not have resolved the dependency set at all.
      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      # All three are ADVISORY. The repo currently has ~1000 ruff findings
      # (mostly trailing whitespace and pre-PEP604 annotations) and has never
      # been black-formatted, so gating on them here would mean the pipeline
      # stays red and nothing gets tested. The pre-commit hooks enforce these
      # on *changed* files, which retires the backlog incrementally. Promote
      # each of these to a hard gate as its backlog item lands.
      - name: Lint with ruff (advisory)
        run: uv run ruff check portfolio_tracker tests || true

      - name: Format check with black (advisory)
        run: uv run black --check portfolio_tracker tests || true

      - name: Type check with mypy (advisory)
        run: uv run mypy portfolio_tracker || true

      # Hard gate: syntax errors and undefined names are never acceptable.
      - name: Fatal lint errors
        run: uv run ruff check portfolio_tracker tests --select F821,F811,F822

      - name: Run tests
        env:
          TESTING: '1'
        run: uv run pytest --cov=portfolio_tracker --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
